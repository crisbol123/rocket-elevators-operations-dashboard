services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: platform/api
    ports:
      - "8081:8081"
    depends_on:
      - db
    volumes:
      - ./data:/data:ro
      - ./platform/elevator_fleet.csv:/platform/elevator_fleet.csv:ro
    environment:
      DATA_DIR: /data
      FLEET_CSV: /platform/elevator_fleet.csv
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  postgres_data:
