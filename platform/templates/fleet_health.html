<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">

  <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-xs uppercase tracking-wide text-slate-500">Fleet Size</div>
    <div class="mt-1 text-2xl font-bold text-slate-900">{{ total_elevators }}</div>
    <div class="mt-0.5 text-xs text-slate-400">Total registered elevators</div>
  </div>

  <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-xs uppercase tracking-wide text-slate-500">Risk Distribution</div>
    <div class="mt-2 flex flex-col gap-1">
      <div class="flex items-center justify-between text-xs">
        <span class="inline-flex items-center rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700">High</span>
        <span class="font-mono font-semibold text-slate-700">{{ high }}</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="inline-flex items-center rounded-full bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-700">Medium</span>
        <span class="font-mono font-semibold text-slate-700">{{ medium }}</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="inline-flex items-center rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-700">Low</span>
        <span class="font-mono font-semibold text-slate-700">{{ low }}</span>
      </div>
    </div>
  </div>

  <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="text-xs uppercase tracking-wide text-slate-500">Inspection Pass Rate</div>
    <div class="mt-1 text-2xl font-bold text-slate-900">{{ pass_rate }}</div>
    <div class="mt-0.5 text-xs text-slate-400">Inspections with outcome "Passed"</div>
  </div>

</div>
